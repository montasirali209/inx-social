[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"exec /opt/venv/bin/uvicorn stock_compat_entry:app --host 0.0.0.0 --port ${PORT:-8080}\""
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
