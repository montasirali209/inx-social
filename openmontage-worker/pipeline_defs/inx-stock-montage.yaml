name: inx-stock-montage
version: "1.0"
description: INXSocial one-prompt stock-footage montage powered by the OpenMontage tool and checkpoint runtime.
category: documentary
stability: beta
default_checkpoint_policy: auto_noncreative
orchestration:
  mode: executive-producer
  skill: pipelines/documentary-montage/executive-producer
  budget_default_usd: 1.00
  max_revisions_per_stage: 2
  max_send_backs: 1
  max_wall_time_minutes: 30
extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: false
  custom_tools: false
required_skills:
  - pipelines/documentary-montage/idea-director
  - pipelines/documentary-montage/scene-director
  - pipelines/documentary-montage/asset-director
  - pipelines/documentary-montage/edit-director
  - pipelines/documentary-montage/compose-director
  - meta/reviewer
  - meta/checkpoint-protocol
compatible_playbooks:
  - clean-professional
  - premium-minimalist
stages:
  - name: idea
    skill: pipelines/documentary-montage/idea-director
    produces: [brief]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Clear theme, concrete duration, one tone]
    success_criteria: [Schema-valid brief artifact]
  - name: scene_plan
    skill: pipelines/documentary-montage/scene-director
    required_artifacts_in: [brief]
    produces: [scene_plan]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Concrete searchable scenes, duration coverage]
    success_criteria: [Schema-valid scene_plan artifact]
  - name: assets
    skill: pipelines/documentary-montage/asset-director
    required_artifacts_in: [brief, scene_plan]
    produces: [asset_manifest]
    required_tools: [direct_clip_search]
    optional_tools: [pixabay_music, openai_tts]
    tools_available: [direct_clip_search, pixabay_music, openai_tts]
    checkpoint_required: true
    human_approval_default: false
    review_focus: [One licensed clip per scene, provenance recorded]
    success_criteria: [Schema-valid asset_manifest artifact]
  - name: edit
    skill: pipelines/documentary-montage/edit-director
    required_artifacts_in: [scene_plan, asset_manifest]
    produces: [edit_decisions]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Runtime remains locked, exact cut durations]
    success_criteria: [Schema-valid edit_decisions artifact]
  - name: compose
    skill: pipelines/documentary-montage/compose-director
    required_artifacts_in: [brief, asset_manifest, edit_decisions]
    produces: [render_report]
    required_tools: [video_compose]
    tools_available: [video_compose]
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Output exists, resolution and duration verified]
    success_criteria: [Schema-valid render_report artifact]

