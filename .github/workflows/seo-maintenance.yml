name: Phase 3 SEO Maintenance

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase3-seo-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Safe source SEO maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: deployment/railway-postgres
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deterministic low-risk SEO maintenance
        run: node scripts/phase3-seo-source-maintenance.js --apply

      - name: Detect source changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- inx-social-cloud-backend/public/robots.txt inx-social-cloud-backend/public/sitemap.xml landing-next/public/robots.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create guarded maintenance pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="codex/phase3-seo-autofix-${GITHUB_RUN_ID}"
          git config user.name "INXSocial SEO Autopilot"
          git config user.email "seo-autopilot@users.noreply.github.com"
          git checkout -b "$branch"
          git add inx-social-cloud-backend/public/robots.txt inx-social-cloud-backend/public/sitemap.xml landing-next/public/robots.txt
          git commit -m "Phase 3: apply safe SEO source maintenance"
          git push origin "$branch"
          url="$(gh pr create             --base deployment/railway-postgres             --head "$branch"             --title "Phase 3: automatic safe SEO maintenance"             --body "Automated low-risk SEO maintenance generated by the Phase 3 source guard. Scope is restricted to robots.txt and canonical sitemap synchronisation. Required CI remains mandatory before merge.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge after required checks
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::warning::Auto-merge could not be enabled. The guarded PR remains open for review; production was not bypassed."
          fi
