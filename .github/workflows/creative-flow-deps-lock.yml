name: Creative Flow dependency lock

on:
  push:
    branches:
      - codex/creative-flow-rebuild-stage-2

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creative-flow-rebuild-stage-2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: inx-social-cloud-backend/frontend/package-lock.json
      - name: Install Creative Flow motion dependencies
        working-directory: inx-social-cloud-backend/frontend
        run: npm install --save-exact @xyflow/react@12.12.0 gsap@3.15.0 @rive-app/react-canvas@4.36.0
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inx-social-cloud-backend/frontend/package.json inx-social-cloud-backend/frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(creative-flow): lock motion workspace dependencies"
          git push origin HEAD:codex/creative-flow-rebuild-stage-2
