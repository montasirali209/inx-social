name: INX Social CI

on:
  pull_request:
  push:
    branches:
      - main
      - deployment/railway-postgres
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: inx-social-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: Source safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets and local data
        shell: bash
        run: |
          tracked="$(git ls-files)"
          if echo "$tracked" | grep -E '(^|/)(\.env|scheduler-state\.json|dev\.db)$'; then
            echo "A secret or local runtime file is tracked. Remove it before release."
            exit 1
          fi

  desktop-check:
    name: Desktop syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run lint

  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inx-social-cloud-backend
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-only-jwt-secret
      TOKEN_ENCRYPTION_KEY: ci-only-token-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inx-social-cloud-backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  windows-installer:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: INX-Social-Windows
          path: release/*.exe
          if-no-files-found: error
