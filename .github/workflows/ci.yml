name: INX Social CI

on:
  pull_request:
  push:
    branches:
      - main
      - deployment/railway-postgres
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inx-social-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: Source safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets and local data
        shell: bash
        run: |
          tracked="$(git ls-files)"
          if echo "$tracked" | grep -E '(^|/)(\.env($|\.)|scheduler-state\.json$|dev\.db$|.*\.(pfx|p12|pem|key)$)' | grep -vE '(^|/)\.env\.example$'; then
            echo "A secret or local runtime file is tracked. Remove it before release."
            exit 1
          fi
          if echo "$tracked" | grep -Ei '(^|/).*\.zip$|(^|/)(_[^/]*backup|[^/]*-backup)(/|$)'; then
            echo "A ZIP archive or local backup is tracked. Keep release source and backups outside Git."
            exit 1
          fi

  desktop-check:
    name: Desktop syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run check:release

  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inx-social-cloud-backend
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-only-jwt-secret
      TOKEN_ENCRYPTION_KEY: ci-only-token-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inx-social-cloud-backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run check
      - run: npm test

  windows-installer:
    name: Hardened Windows installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      installer-name: ${{ steps.release-metadata.outputs.installer-name }}
      sha256-name: ${{ steps.release-metadata.outputs.sha256-name }}
      sha256: ${{ steps.release-metadata.outputs.sha256 }}
      file-size: ${{ steps.release-metadata.outputs.file-size }}
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require a signing certificate for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw 'GitHub secret WINDOWS_CERTIFICATE is required for a production tag.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw 'GitHub secret WINDOWS_CERTIFICATE_PASSWORD is required for a production tag.'
          }

      - run: npm ci
      - run: npm run lint
      - run: npm run check:release
      - name: Build installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            npm run dist:signed
          } else {
            npm run dist
          }

      - name: Verify packaged ASAR and Electron fuses
        run: npm run check:packaged -- "release/win-unpacked/INX Social.exe"

      - name: Check tag, signature and checksum
        id: release-metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match package version $version. Expected $expectedTag."
            }
          }

          $installer = Get-ChildItem 'release/INX-Social-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created.' }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "The production installer signature is not valid: $($signature.Status)."
            }
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          "$hash  $($installer.Name)" | Set-Content -Path $checksumPath -Encoding ascii

          "version=$version" >> $env:GITHUB_OUTPUT
          "installer-name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sha256-name=$($installer.Name).sha256" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "file-size=$($installer.Length)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: INX-Social-Windows-${{ steps.release-metadata.outputs.version }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Approve and publish production release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - source-safety
      - desktop-check
      - backend-check
      - windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: INX-Social-Windows-${{ needs.windows-installer.outputs.version }}
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_NAME: ${{ needs.windows-installer.outputs.installer-name }}
          SHA256_NAME: ${{ needs.windows-installer.outputs.sha256-name }}
          VERSION: ${{ needs.windows-installer.outputs.version }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "release/$INSTALLER_NAME" "release/$SHA256_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "release/$INSTALLER_NAME" "release/$SHA256_NAME" --verify-tag --title "INX Social $VERSION" --generate-notes
          fi

      - name: Publish authorised-download metadata
        env:
          RELEASE_API_KEY: ${{ secrets.RELEASE_API_KEY }}
          INSTALLER_NAME: ${{ needs.windows-installer.outputs.installer-name }}
          VERSION: ${{ needs.windows-installer.outputs.version }}
          FILE_SIZE: ${{ needs.windows-installer.outputs.file-size }}
          SHA256: ${{ needs.windows-installer.outputs.sha256 }}
        shell: bash
        run: |
          if [ -z "$RELEASE_API_KEY" ]; then
            echo 'The production-release environment secret RELEASE_API_KEY is required.'
            exit 1
          fi

          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$INSTALLER_NAME"
          payload="$(jq -n \
            --arg version "$VERSION" \
            --arg fileName "$INSTALLER_NAME" \
            --arg storageKey "$download_url" \
            --arg fileSizeBytes "$FILE_SIZE" \
            --arg sha256 "$SHA256" \
            '{version:$version,fileName:$fileName,storageKey:$storageKey,fileSizeBytes:$fileSizeBytes,sha256:$sha256,mandatory:false}')"

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Release-Api-Key: $RELEASE_API_KEY" \
            --data "$payload" \
            https://api.social.inaxx.co.uk/api/releases/publish
