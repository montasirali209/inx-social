<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Forgot password — INX Social</title><link rel="stylesheet" href="portal.css"></head><body class="auth"><form class="auth-card" id="f"><h1>Forgot password</h1><input class="input" id="email" type="email" placeholder="Email" required><p id="m"></p><button class="btn">Send reset link</button></form><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();m.textContent=d.message||d.error;if(d.devResetToken)m.innerHTML+=`<br><a href="reset-password.html?token=${d.devResetToken}">Development reset link</a>`}</script></body></html>
