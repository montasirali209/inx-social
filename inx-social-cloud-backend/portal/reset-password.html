<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reset password — INX Social</title><link rel="stylesheet" href="portal.css"></head><body class="auth"><form class="auth-card" id="f"><h1>Create a new password</h1><input class="input" id="password" type="password" minlength="8" placeholder="New password" required><p id="m"></p><button class="btn">Update password</button></form><script>f.onsubmit=async e=>{e.preventDefault();const token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});const d=await r.json();m.innerHTML=(d.message||d.error)+(r.ok?' <a href="login.html">Sign in</a>':'')}</script></body></html>
