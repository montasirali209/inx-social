<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/inx-social-logo.png">
  <title>Create a new password — INX Social</title><link rel="stylesheet" href="/portal/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-showcase">
      <a class="brand" href="/"><img class="brand-logo brand-wordmark" src="/assets/inx-social-wordmark.png" alt="INX Social"></a>
      <div class="showcase-copy"><span class="kicker">Account recovery</span><h1>Secure your <span>workspace.</span></h1><p>Choose a new password to get back into your INX Social account.</p></div>
      <div class="showcase-footer">Secure customer access · INX Social</div>
    </section>
    <section class="auth-panel">
      <form class="auth-card login-card" id="resetForm" novalidate>
        <div class="mobile-brand"><img src="/assets/inx-social-wordmark.png" alt="INX Social"></div>
        <div class="card-head"><h2>Create a new password</h2><p>Use at least 8 characters. You’ll be able to sign in once it’s updated.</p></div>
        <label class="field" for="passwordInput"><span class="field-label">New password</span><span class="password-wrap"><input class="input" id="passwordInput" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-target="passwordInput">Show</button></span></label>
        <label class="field" for="confirmInput"><span class="field-label">Confirm new password</span><span class="password-wrap"><input class="input" id="confirmInput" type="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" data-target="confirmInput">Show</button></span></label>
        <div class="message" id="formMessage" aria-live="polite"></div>
        <button class="submit" id="submitButton" type="submit">Update password</button>
        <p class="switch"><a href="login.html">Back to sign in</a></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('resetForm');
    const passwordInput = document.getElementById('passwordInput');
    const confirmInput = document.getElementById('confirmInput');
    const message = document.getElementById('formMessage');
    const button = document.getElementById('submitButton');
    const token = new URLSearchParams(location.search).get('token');
    function show(text, type) { message.className = `message ${type}`; message.textContent = text; }
    if (!token || token.length < 20) {
      show('This reset link is missing or invalid. Request a new link to continue.', 'error');
      const link = document.createElement('a');
      link.href = 'forgot-password.html';
      link.textContent = ' Request a new link';
      message.append(link);
      button.disabled = true;
    }
    document.querySelectorAll('.password-toggle').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
        toggle.textContent = input.type === 'text' ? 'Hide' : 'Show';
      });
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!token || token.length < 20) return;
      if (passwordInput.value.length < 8) return show('Use at least 8 characters for your new password.', 'error');
      if (passwordInput.value !== confirmInput.value) return show('The passwords do not match.', 'error');
      message.className = 'message'; message.replaceChildren();
      button.disabled = true; button.textContent = 'Updating…';
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: passwordInput.value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not update your password. Please request a new link.');
        passwordInput.value = ''; confirmInput.value = '';
        show(data.message || 'Password updated. You can now sign in.', 'success');
        const link = document.createElement('a');
        link.href = 'login.html'; link.textContent = ' Sign in'; message.append(link);
        button.textContent = 'Password updated';
      } catch (error) {
        show(error.message, 'error');
        button.disabled = false; button.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
